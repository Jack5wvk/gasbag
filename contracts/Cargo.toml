[workspace]
resolver = "3"
members = ["heartbeat", "gasbag", "pacemaker", "hatchery"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/near-hackathon/gasbag"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
uint = { version = "0.10", default-features = false }

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Opt into extra safety checks on arithmetic operations.
overflow-checks = true
